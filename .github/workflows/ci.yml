      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build into a game target and run the suite
        # An editor target compiles the plugin with WITH_EDITOR on, and packaging builds the game target
        # with it off. An editor-only API shipped past every leg this way on 2026-11-16.
